<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Apresentação Vértice · Acesso</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #eaf5ef; background: radial-gradient(circle at 70% 10%, #173c35, #071219 58%); }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #34574d; border-radius: 22px; background: #10232a; box-shadow: 0 28px 90px #0006; }
      .brand { color: #b6f37b; font-size: 13px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
      h1 { margin: 20px 0 8px; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.04em; }
      p { color: #a9c1b7; line-height: 1.5; }
      label { display: block; margin: 30px 0 9px; font-weight: 700; }
      input, button { width: 100%; min-height: 48px; border-radius: 10px; font: inherit; }
      input { padding: 0 14px; color: #eaf5ef; background: #071219; border: 1px solid #4c6c62; }
      input:focus-visible, button:focus-visible { outline: 3px solid #b6f37b; outline-offset: 3px; }
      button { margin-top: 16px; border: 0; color: #10232a; background: #b6f37b; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .65; cursor: wait; }
      #message { min-height: 24px; margin: 13px 0 0; color: #ff9a9a; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Vértice</div>
      <h1>Apresentação protegida</h1>
      <p>Digite a senha para abrir a apresentação do MVP.</p>
      <form id="access-form">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Abrir apresentação</button>
      </form>
      <p id="message" role="alert" aria-live="polite"></p>
    </main>
    <script>
      const endpoint = "https://ttgtultenyzuvmkdxqcd.supabase.co/functions/v1/presentation-access";
      const form = document.getElementById("access-form");
      const passwordInput = document.getElementById("password");
      const button = form.querySelector("button");
      const message = document.getElementById("message");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = "";
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: passwordInput.value }),
            cache: "no-store",
          });
          if (response.status === 401) {
            message.textContent = "Senha incorreta. Tente novamente.";
            passwordInput.value = "";
            passwordInput.focus();
            return;
          }
          if (!response.ok) throw new Error("Não foi possível abrir a apresentação agora.");
          const { html } = await response.json();
          if (typeof html !== "string") throw new Error("Resposta inválida do servidor.");
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          message.textContent = error.message || "Erro de conexão. Tente novamente.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
